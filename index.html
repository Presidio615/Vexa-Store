<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <meta name="description"
        content="Techies Store - Shop quality products online">

    <title>Vexa Store | Products</title>

    <link rel="stylesheet" href="css/style.css">
</head>


<body>

    <!-- NAVBAR -->
    <header class="navbar">

        <div class="container nav-content">

            <a href="index.html" class="logo">
                Vexa Store
            </a>

            <nav>
                <a href="index.html">Products</a>

                <a href="cart.html">
                    Cart
                    <span id="cart-count">0</span>
                </a>
            </nav>

        </div>

    </header>


    <!-- HERO -->
    <section class="hero">

        <div class="container">

            <h1>Shop Our Products</h1>

            <p>
                Find quality products at affordable prices.
            </p>

        </div>

    </section>


    <!-- PRODUCTS -->
    <main class="container products-section">

        <div class="section-header">

            <h2>Products</h2>

            <select id="category-filter">

                <option value="all">
                    All Categories
                </option>

            </select>

        </div>


        <div id="loading">
            Loading products...
        </div>


        <div
            id="products-container"
            class="products-grid">
        </div>

    </main>


    <script src="js/products.js"></script>

</body>


</html>
